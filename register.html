<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Portal - Car Park</title>
  <style>
    body {
      margin: 0; padding: 0; font-family: Arial, sans-serif;
      background: linear-gradient(to right, #0a2540, #1e90ff);
      height: 100vh; display: flex; align-items: center; justify-content: center;
    }

    .admin-btn {
      position: absolute; top: 20px; right: 30px;
      background-color: white; color: #0d6efd; padding: 8px 18px;
      border: 2px solid #0d6efd; border-radius: 25px;
      font-weight: bold; cursor: pointer; transition: 0.3s;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 30px; border-radius: 12px; width: 380px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .logo { width: 100px; height: auto; display: flex; justify-content: center; margin: 0 auto 18px; }
    .logo img { width: 100%; height: auto; display: block; }

    h2 { text-align: center; color: #333; margin-bottom: 20px; }
    input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    
    .password-container { position: relative; }
    .toggle-password { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: none; cursor: pointer; font-size: 18px; }

    .btn-green { background-color: #28a745; color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    .btn-red { background-color: #dc3545; color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }

    /* Button Group styling */
    .button-group {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
    }
    .button-group button {
      width: 48%; /* Buri buto ifata 48% y'ubugari */
      margin-top: 0;
    }

    .forgot { color: #0d6efd; text-decoration: none; font-size: 14px; display: block; text-align: center; margin-top: 15px; }
    .create-link { background-color: #f8f9fa; color: #333; padding: 10px; border: 1px solid #ddd; border-radius: 6px; text-decoration: none; display: block; text-align: center; margin-top: 10px; }

    #register-form { display: none; }
  </style>
</head>
<body>

  <div style="position:absolute; top:18px; left:18px; z-index:1000;">
    <a href="home.html" style="color:#0d6efd; text-decoration:none; font-weight:bold; background:white; padding:10px 14px; border-radius:25px; display:inline-block;">← Home</a>
  </div>

  <button class="admin-btn" onclick="window.location.href='admin.html'">Admin</button>

  <div class="container">
    <div class="logo"><img src="logo.png" alt="Car Park Logo"></div>

    <div id="login-section">
      <h2>User Login</h2>
      <form onsubmit="handleLogin(event)">
        <input id="login-identifier" type="text" placeholder="Username or Mobile" required>
        <div class="password-container">
          <input id="login-password" type="password" class="pwd" placeholder="Password" required>
          <button type="button" class="toggle-password" onclick="togglePwd(this)">👁</button>
        </div>
        <button type="submit" class="btn-green">Login</button>
      </form>
      <a href="javascript:void(0)" class="forgot" onclick="switchForm('forgot')">Forgot password?</a>
      <a href="javascript:void(0)" class="create-link" onclick="switchForm('register')">Create new account</a>
    </div>

    <div id="register-form">
      <h2>Register</h2>
      <form onsubmit="handleRegister(event)">
        <input id="register-username" type="text" placeholder="Username" required>
        <input id="register-phone" type="tel" placeholder="Phone number" required>
        <input id="register-plate" type="text" placeholder="Plate number" required>
        <select id="register-cartype" required>
          <option value="">Select car type</option>
          <option value="sedan">Sedan</option>
          <option value="suv">SUV</option>
          <option value="truck">Truck</option>
          <option value="toyota">Toyota</option>
          <option value="hatchback">Hatchback</option>
          <option value="rav4">Rav4</option>

        </select>
        <input id="register-email" type="email" placeholder="Email" required>
        <div class="password-container">
          <input id="register-password" type="password" class="pwd" placeholder="Password" required>
          <button type="button" class="toggle-password" onclick="togglePwd(this)">👁</button>
        </div>
        
        <div class="button-group">
          <button type="button" class="btn-red" onclick="switchForm('login')">Cancel</button>
          <button type="submit" class="btn-green">Create Account</button>
        </div>
      </form>
    </div>

    <div id="forgot-form" style="display:none;">
      <h2>Forgot password?</h2>
      <form onsubmit="sendResetCode(event)">
        <input id="forgot-identifier" type="text" placeholder="Username, Email, or Phone" required>
        
        <div class="button-group">
          <button type="button" class="btn-red" onclick="switchForm('login')">Go back</button>
          <button type="submit" class="btn-green">Send code</button>
        </div>
      </form>
      
      <p id="reset-code-message" style="color:#28a745; margin-top:12px; display:none;"></p>
      <div id="reset-code-block" style="display:none; margin-top:18px;">
        <form onsubmit="resetPassword(event)">
          <input id="reset-code" type="text" placeholder="Enter code" required>
          <input id="new-password-reset" type="password" class="pwd" placeholder="New password" required>
          <button type="submit" class="btn-green">Change password</button>
        </form>
      </div>
    </div>

  </div>

  <script>
    function switchForm(formName) {
      const login = document.getElementById('login-section');
      const register = document.getElementById('register-form');
      const forgot = document.getElementById('forgot-form');
      const resetCodeMessage = document.getElementById('reset-code-message');
      const resetCodeBlock = document.getElementById('reset-code-block');

      login.style.display = 'none';
      register.style.display = 'none';
      forgot.style.display = 'none';
      resetCodeBlock.style.display = 'none';
      resetCodeMessage.style.display = 'none';
      resetCodeMessage.innerText = '';

      if (formName === 'register') {
        register.style.display = 'block';
      } else if (formName === 'forgot') {
        forgot.style.display = 'block';
      } else {
        login.style.display = 'block';
      }
    }

    function togglePwd(btn) {
      const input = btn.parentElement.querySelector('.pwd');
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "👁‍🗨";
      } else {
        input.type = "password";
        btn.textContent = "👁";
      }
    }

    function getUsers() { return JSON.parse(localStorage.getItem('carParkUsers') || '[]'); }
    function saveUsers(users) { localStorage.setItem('carParkUsers', JSON.stringify(users)); }

    function handleLogin(event) {
      event.preventDefault();
      const identifier = document.getElementById('login-identifier').value.trim();
      const password = document.getElementById('login-password').value;
      const users = getUsers();
      const user = users.find(u => u.username.toLowerCase() === identifier.toLowerCase() || u.phone === identifier);
      if (!user) { alert('No account found.'); return; }
      if (user.password !== password) { alert('Password incorrect.'); return; }
      localStorage.setItem('currentUser', JSON.stringify(user));
      window.location.href = 'home.html';
    }

    function handleRegister(event) {
      event.preventDefault();
      const username = document.getElementById('register-username').value.trim();
      const phone = document.getElementById('register-phone').value.trim();
      const plate = document.getElementById('register-plate').value.trim();
      const cartype = document.getElementById('register-cartype').value;
      const email = document.getElementById('register-email').value.trim();
      const password = document.getElementById('register-password').value;
      const users = getUsers();
      if (users.some(u => u.username.toLowerCase() === username.toLowerCase() || u.phone === phone || u.email.toLowerCase() === email)) {
        alert('Account already exists.'); return;
      }
      const newUser = { username, phone, plate, cartype, email, password, registeredAt: new Date().toISOString() };
      users.push(newUser);
      saveUsers(users);
      localStorage.setItem('currentUser', JSON.stringify(newUser));
      alert('Account created successfully!');
      window.location.href = 'home.html';
    }

    function sendResetCode(event) {
      event.preventDefault();
      const identifier = document.getElementById('forgot-identifier').value.trim();
      const users = getUsers();
      const user = users.find(u => u.username.toLowerCase() === identifier.toLowerCase() || u.email.toLowerCase() === identifier.toLowerCase() || u.phone === identifier);
      if (!user) { alert('No user found.'); return; }
      const code = Math.floor(100000 + Math.random() * 900000).toString();
      localStorage.setItem('resetPasswordUser', user.username);
      localStorage.setItem('resetPasswordCode', code);
      localStorage.setItem('resetPasswordExpires', (Date.now() + 15 * 60 * 1000).toString());
      const resetCodeMessage = document.getElementById('reset-code-message');
      const resetCodeBlock = document.getElementById('reset-code-block');
      resetCodeMessage.innerText = `Your code is ${code}. Expires in 15 min.`;
      resetCodeMessage.style.display = 'block';
      resetCodeBlock.style.display = 'block';
    }

    function resetPassword(event) {
      event.preventDefault();
      const enteredCode = document.getElementById('reset-code').value.trim();
      const newPassword = document.getElementById('new-password-reset').value;
      const savedCode = localStorage.getItem('resetPasswordCode');
      const savedUser = localStorage.getItem('resetPasswordUser');
      const expires = Number(localStorage.getItem('resetPasswordExpires') || '0');
      if (Date.now() > expires) { alert('Code expired.'); return; }
      if (enteredCode !== savedCode) { alert('Incorrect code.'); return; }
      const users = getUsers();
      const index = users.findIndex(u => u.username === savedUser);
      if (index === -1) { alert('User not found.'); return; }
      users[index].password = newPassword;
      saveUsers(users);
      localStorage.removeItem('resetPasswordUser');
      localStorage.removeItem('resetPasswordCode');
      localStorage.removeItem('resetPasswordExpires');
      alert('Password changed!');
      switchForm('login');
    }
  </script>

</body>
</html>
